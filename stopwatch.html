<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑워치</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #e5e5ea;
    --start: #34c759;
    --stop: #ff3b30;
    --neutral: #8e8e93;
    --best: #34c759;
    --worst: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --line: #2c2c2e;
      --neutral: #636366;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 440px; }
  .display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(56px, 17vw, 84px);
    font-weight: 200;
    text-align: center;
    letter-spacing: -1px;
    margin: 24px 0 32px;
  }
  .display .ms { color: var(--muted); }
  .buttons {
    display: flex;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  button {
    width: 88px; height: 88px;
    border-radius: 50%;
    border: none;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: transform .08s, opacity .2s;
  }
  button:active { transform: scale(.94); }
  button:disabled { opacity: .4; cursor: default; }
  #lapBtn { background: var(--neutral); }
  #toggleBtn { background: var(--start); }
  #toggleBtn.running { background: var(--stop); }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    justify-content: space-between;
    padding: 14px 4px;
    border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
    font-size: 17px;
  }
  li:last-child { border-bottom: 1px solid var(--line); }
  li.best { color: var(--best); }
  li.worst { color: var(--worst); }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="display" id="display">00:00<span class="ms">.00</span></div>
  <div class="buttons">
    <button id="lapBtn" disabled>랩</button>
    <button id="toggleBtn">시작</button>
  </div>
  <ul id="laps"></ul>
  <p class="hint">Space: 시작/정지 · L: 랩 · R: 초기화</p>
</div>

<script>
  const display = document.getElementById('display');
  const toggleBtn = document.getElementById('toggleBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapList = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() 기준 시작 시점
  let elapsed = 0;     // 정지 시점까지 누적된 시간(ms)
  let laps = [];       // 각 랩의 소요 시간(ms)
  let lapStart = 0;    // 현재 랩이 시작된 총 경과 시간
  let rafId = null;

  function now() { return running ? elapsed + performance.now() - startTime : elapsed; }

  function format(ms, html) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const pad = n => String(n).padStart(2, '0');
    const main = (h ? h + ':' : '') + pad(m) + ':' + pad(s);
    return html ? `${main}<span class="ms">.${pad(cs)}</span>` : `${main}.${pad(cs)}`;
  }

  function tick() {
    display.innerHTML = format(now(), true);
    renderCurrentLap();
    rafId = requestAnimationFrame(tick);
  }

  function renderCurrentLap() {
    const cur = lapList.querySelector('li.current span:last-child');
    if (cur) cur.textContent = format(now() - lapStart);
  }

  function renderLaps() {
    lapList.innerHTML = '';
    const t = now();
    if (running || t > 0) {
      const li = document.createElement('li');
      li.className = 'current';
      li.innerHTML = `<span>랩 ${laps.length + 1}</span><span>${format(t - lapStart)}</span>`;
      lapList.appendChild(li);
    }
    let min = -1, max = -1;
    if (laps.length >= 2) {
      min = laps.indexOf(Math.min(...laps));
      max = laps.indexOf(Math.max(...laps));
    }
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      if (i === min) li.className = 'best';
      else if (i === max) li.className = 'worst';
      li.innerHTML = `<span>랩 ${i + 1}</span><span>${format(laps[i])}</span>`;
      lapList.appendChild(li);
    }
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startTime;
      running = false;
      cancelAnimationFrame(rafId);
      display.innerHTML = format(elapsed, true);
    } else {
      startTime = performance.now();
      running = true;
      tick();
    }
    updateButtons();
    renderLaps();
  }

  function lapOrReset() {
    if (running) {
      const t = now();
      laps.push(t - lapStart);
      lapStart = t;
      renderLaps();
    } else {
      reset();
    }
  }

  function reset() {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed = 0; lapStart = 0; laps = [];
    display.innerHTML = format(0, true);
    lapList.innerHTML = '';
    updateButtons();
  }

  function updateButtons() {
    toggleBtn.textContent = running ? '정지' : '시작';
    toggleBtn.classList.toggle('running', running);
    lapBtn.textContent = running || elapsed === 0 ? '랩' : '재설정';
    lapBtn.disabled = !running && elapsed === 0;
  }

  toggleBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lapOrReset);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key.toLowerCase() === 'l' && running) lapOrReset();
    else if (e.key.toLowerCase() === 'r' && !running) reset();
  });
</script>
</body>
</html>
